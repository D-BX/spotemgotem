<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="spotemgotem classic player">
  <!-- Full-bleed background so the icon is safe as a maskable PWA icon. -->
  <rect width="512" height="512" fill="#141418"/>
  <!-- Beveled player body, centered within the maskable safe zone. -->
  <rect x="96" y="128" width="320" height="256" rx="20" fill="#2a2a33" stroke="#4a4a57" stroke-width="4"/>
  <!-- LCD screen. -->
  <rect x="128" y="160" width="256" height="112" rx="8" fill="#0a0a0c"/>
  <!-- Green "now playing" bars, Winamp-style. -->
  <g fill="#40a060">
    <rect x="148" y="236" width="12" height="20"/>
    <rect x="166" y="220" width="12" height="36"/>
    <rect x="184" y="204" width="12" height="52"/>
    <rect x="202" y="224" width="12" height="32"/>
    <rect x="220" y="240" width="12" height="16"/>
    <rect x="238" y="212" width="12" height="44"/>
    <rect x="256" y="228" width="12" height="28"/>
  </g>
  <!-- Elapsed time dots. -->
  <circle cx="320" cy="190" r="6" fill="#40a060"/>
  <circle cx="344" cy="190" r="6" fill="#40a060"/>
  <!-- Transport: play triangle. -->
  <path d="M212 304 L212 360 L260 332 Z" fill="#e6e6ea"/>
  <!-- Transport: pause bars. -->
  <rect x="284" y="304" width="16" height="56" fill="#e6e6ea"/>
  <rect x="308" y="304" width="16" height="56" fill="#e6e6ea"/>
</svg>
